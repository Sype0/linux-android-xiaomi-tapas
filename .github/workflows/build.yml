name: Build Droidian kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md

env:
  PACKAGES_DIR: /home/runner/pkg
  BUILD_IMAGE: quay.io/droidian/build-essential:next-amd64
  PREBUILT_MODULES_REPO: https://github.com/SM6225-Android-Playground/android_device_xiaomi_tapas-kernel

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare kernel sources
        run: scripts/prepare-kernel.sh

      - name: Build packages
        run: |
          mkdir -p "${PACKAGES_DIR}"
          docker run --rm \
            -v "${PACKAGES_DIR}":/buildd \
            -v "${GITHUB_WORKSPACE}":/buildd/sources \
            "${BUILD_IMAGE}" \
            bash -c "cd /buildd/sources && \
              apt-get update && \
              apt-get install -y --no-install-recommends linux-packaging-snippets && \
              debian/rules debian/control && \
              RELENG_HOST_ARCH=arm64 releng-build-package"

      - name: Collect images
        run: |
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" out "${PACKAGES_DIR}"
          cp out/KERNEL_OBJ/boot.img out/KERNEL_OBJ/recovery.img dist/
          cp out/KERNEL_OBJ/stub-init_boot.img dist/init_boot.img
          # Partition sizes of tapas (boot: 128 MiB, init_boot: 8 MiB)
          check_size() {
            size=$(stat -c %s "dist/${1}")
            echo "${1}: ${size} bytes (partition: ${2})"
            [ "${size}" -le "${2}" ] || { echo "::error::${1} does not fit its partition"; exit 1; }
          }
          check_size boot.img 134217728
          check_size recovery.img 104857600
          check_size init_boot.img 8388608
          # The Halium initramfs must be embedded into the kernel
          embedded=$(stat -c %s out/KERNEL_OBJ/usr/initramfs_inc_data)
          echo "Embedded initramfs: ${embedded} bytes"
          [ "${embedded}" -gt 1000000 ] || { echo "::error::initramfs is not embedded into the kernel"; exit 1; }
          cp out/KERNEL_OBJ/.config dist/kernel.config
          cp out/KERNEL_OBJ/Module.symvers out/KERNEL_OBJ/System.map dist/
          cp "${PACKAGES_DIR}"/*.deb dist/
          (cd dist && sha256sum *.img *.deb > SHA256SUMS)
          ls -la dist
          {
            echo "### Kernel"
            echo '```'
            strings out/KERNEL_OBJ/vmlinux | grep -m1 '^Linux version' || true
            grep -E '^(# )?CONFIG_(SYSVIPC|PID_NS|USER_NS|IPC_NS|VT|DEVTMPFS|FHANDLE|SQUASHFS|TMPFS_POSIX_ACL|AUTOFS_FS|LTO_CLANG_THIN|CFI_CLANG|MODVERSIONS|MODULE_SIG_PROTECT|DEBUG_INFO_BTF|CMDLINE|INITRAMFS_SOURCE)[ =]' dist/kernel.config
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check ABI against the stock vendor modules
        id: kmi
        run: |
          git clone -q --depth 1 "${PREBUILT_MODULES_REPO}" prebuilt-modules
          status=0
          python3 scripts/check-kmi.py dist/Module.symvers prebuilt-modules/modules > dist/kmi-report.txt || status=$?
          cat dist/kmi-report.txt
          {
            echo "### Vendor module ABI check"
            echo '```'
            head -n 60 dist/kmi-report.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidian-kernel-tapas
          path: dist
          if-no-files-found: warn

      - name: Fail if the module ABI is broken
        if: steps.kmi.outputs.status != '0'
        run: |
          echo "::error::The built kernel is not ABI compatible with the stock vendor modules, see kmi-report.txt"
          exit 1

  package:
    name: Build recovery zip
    needs: build
    # Native arm64 runner, so the kernel packages can be installed into the
    # rootfs with a plain chroot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: droidian-kernel-tapas
          path: dist

      - name: Download the Droidian api33 rootfs
        run: |
          asset=$(gh api repos/droidian-images/droidian/releases/tags/nightly \
            --jq '[.assets[] | select(.name | test("phosh-phone-rootfs-api33-arm64.*\\.zip$"))][0].name')
          [ -n "${asset}" ] && [ "${asset}" != "null" ] || { echo "::error::Droidian api33 rootfs not found"; exit 1; }
          echo "Using ${asset}"
          echo "ROOTFS_ASSET=${asset}" >> "${GITHUB_ENV}"
          gh release download nightly --repo droidian-images/droidian --pattern "${asset}" --output rootfs.zip
          mkdir work
          unzip -q rootfs.zip -d work
          rm rootfs.zip
          ls -la work work/data

      - name: Install the kernel into the rootfs
        run: |
          img=work/data/rootfs.img
          sudo e2fsck -fy "${img}" || [ $? -le 1 ]
          size_mb=$(( $(stat -c %s "${img}") / 1048576 ))
          sudo resize2fs "${img}" "$(( size_mb + 512 ))M"
          mkdir mnt
          sudo mount -o loop "${img}" mnt
          sudo mkdir -p mnt/tmp/kernel-debs
          sudo cp dist/linux-image-*.deb dist/linux-bootimage-*.deb mnt/tmp/kernel-debs/
          for fs in proc sys dev; do sudo mount --bind "/${fs}" "mnt/${fs}"; done
          if ! sudo chroot mnt dpkg -s flash-bootimage >/dev/null 2>&1; then
            sudo cp --remove-destination /etc/resolv.conf mnt/etc/resolv.conf.ci
            sudo chroot mnt sh -c 'mv /etc/resolv.conf /etc/resolv.conf.orig 2>/dev/null; cp /etc/resolv.conf.ci /etc/resolv.conf; apt-get update && apt-get install -y --no-install-recommends flash-bootimage; s=$?; rm -f /etc/resolv.conf /etc/resolv.conf.ci; mv /etc/resolv.conf.orig /etc/resolv.conf 2>/dev/null; exit $s'
          fi
          sudo chroot mnt sh -c 'dpkg -i /tmp/kernel-debs/*.deb'
          sudo rm -rf mnt/tmp/kernel-debs
          sudo chroot mnt dpkg -l 'linux-*tapas*'
          ls -la mnt/boot
          ls mnt/boot/boot.img-* mnt/boot/init_boot.img-* mnt/var/lib/lxc/android/android-rootfs.img
          cmp mnt/boot/boot.img-* dist/boot.img
          cmp mnt/boot/init_boot.img-* dist/init_boot.img
          for fs in dev sys proc; do sudo umount "mnt/${fs}"; done
          sudo umount mnt
          sudo e2fsck -fy "${img}" || [ $? -le 1 ]

      - name: Build the zip
        run: |
          python3 scripts/patch-installer.py work
          name="droidian-UNOFFICIAL-phosh-phone-xiaomi_tapas-api33-arm64_$(date -u +%Y%m%d).zip"
          (cd work && zip -q -r "../${name}" META-INF tools setup.sh data)
          size=$(stat -c %s "${name}")
          echo "${name}: ${size} bytes"
          [ "${size}" -lt 2147483648 ] || { echo "::error::zip is too big for a release asset"; exit 1; }
          unzip -l "${name}"
          sha256sum "${name}" > "${name}.sha256"
          echo "ZIP_NAME=${name}" >> "${GITHUB_ENV}"

      - name: Publish release
        run: |
          cat > notes.md <<NOTES
          Droidian for Xiaomi Redmi Note 12 4G (tapas/topaz), built from ${GITHUB_SHA::7}.

          **Untested: this has not been booted on a device yet.**

          Base rootfs: \`${ROOTFS_ASSET}\`

          Install (wipes the phone):
          1. Be on stock MIUI 14 (Android 13) firmware with an unlocked bootloader. The installer refuses any other vendor.
          2. Back up \`boot\`, \`init_boot\`, \`vendor_boot\`, \`dtbo\` and \`vbmeta\`.
          3. In a custom recovery: Format Data, then flash \`${ZIP_NAME}\`.

          The zip installs the rootfs to \`userdata\` and flashes \`boot\` and \`init_boot\` of the active slot.
          The separate images are attached for restoring or flashing with fastboot.
          NOTES
          sed -i 's/^          //' notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "${GITHUB_SHA}" \
            --title "Droidian for tapas ($(date -u +%Y-%m-%d))" --notes-file notes.md \
            "${ZIP_NAME}" "${ZIP_NAME}.sha256" dist/boot.img dist/init_boot.img dist/kmi-report.txt
